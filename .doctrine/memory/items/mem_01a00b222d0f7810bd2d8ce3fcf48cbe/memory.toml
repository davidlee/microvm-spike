schema_version = 1
memory_type = "fact"
status = "active"
title = "escapeShellArg is a no-op on the right of an assignment, and shellcheck owns the hostile-path class"
summary = "A %q'd default in export V=${V:-<d>} is not word-split, so a fixture with a space does not discriminate the escaping — and a genuinely hostile path cannot be a fixture at all."
